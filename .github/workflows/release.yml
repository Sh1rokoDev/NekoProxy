name: Release
run-name: ${{ github.ref_type == 'branch' && 'Warm Android Gradle cache' || format('Release {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - '.github/workflows/release.yml'
      - 'android/**/*.gradle'
      - 'android/**/*.gradle.kts'
      - 'android/gradle.properties'
      - 'android/gradle/**'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Tag deletion events must not displace a pending publish for a pushed tag.
  group: release-${{ github.ref }}${{ github.event.deleted && '-deleted' || '' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    if: >-
      !github.event.deleted &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
       (github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch))
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.ref_type == 'tag' && '["windows", "android", "linux"]' || '["android"]') }}
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-24.04' || 'windows-2025' }}
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          . ./scripts/version.ps1
          $version = Get-NekoVersionInfo -Root $env:GITHUB_WORKSPACE
          if ($env:GITHUB_REF_NAME -cne "v$($version.BaseVersion)") {
            throw "Release tag must match pubspec.yaml: v$($version.BaseVersion)."
          }
          if ($IsLinux -and (git status --porcelain)) { throw 'Release checkout must be clean.' }

      - name: Set Gradle user home
        if: matrix.platform == 'android'
        shell: pwsh
        run: |
          $gradleHome = Join-Path $env:USERPROFILE '.nekoproxy-gradle'
          "GRADLE_USER_HOME=$gradleHome" >> $env:GITHUB_ENV

      - name: Restore Android Gradle dependencies
        if: matrix.platform == 'android'
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache downloaded dependencies and the Wrapper distribution, excluding Gradle's module locks.
          path: &gradle-dependency-paths |
            ~/.nekoproxy-gradle/caches/modules-2/files-2.1
            ~/.nekoproxy-gradle/caches/modules-2/metadata-*
            ~/.nekoproxy-gradle/wrapper/dists
          key: >-
            android-gradle-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('.github/workflows/release.yml', 'android/**/*.gradle', 'android/**/*.gradle.kts',
                'android/gradle.properties', 'android/gradle/**', 'pubspec.lock') }}
          lookup-only: ${{ github.ref_type == 'branch' }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: github.ref_type == 'tag' || steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.27.4'
          # Release tags cannot reuse each other's caches.
          cache: false

      - name: Set up Flutter
        if: runner.os == 'Windows' && (github.ref_type == 'tag' || steps.gradle-cache.outputs.cache-hit != 'true')
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --quiet --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout failed.' }
          # Flutter plugins use symlinks even when preparing an Android build on Windows.
          $developerMode = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $developerMode -Force | Out-Null
          New-ItemProperty -Path $developerMode -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
          Join-Path $sdk 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Set up NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.platform == 'android' && (github.ref_type == 'tag' || steps.gradle-cache.outputs.cache-hit != 'true')
        with:
          distribution: temurin
          # Android Lint calls List.removeLast(), which was added in JDK 21.
          java-version: '21'

      - name: Set up Android build tools
        if: matrix.platform == 'android' && (github.ref_type == 'tag' || steps.gradle-cache.outputs.cache-hit != 'true')
        shell: pwsh
        run: |
          flutter config --jdk-dir="$env:JAVA_HOME"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter JDK setup failed.' }
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed.' }

      - name: Warm Android Gradle dependencies
        if: github.ref_type == 'branch' && steps.gradle-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env: &rule-metadata-env
          NEKO_RULES_GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build-android.ps1

      - name: Save Android Gradle dependencies
        if: github.ref_type == 'branch' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *gradle-dependency-paths
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env: *rule-metadata-env
        run: ./scripts/package-windows.ps1

      - name: Package and verify signed Android APK
        if: matrix.platform == 'android' && github.ref_type == 'tag'
        shell: pwsh
        env:
          NEKO_RULES_GITHUB_TOKEN: ${{ github.token }}
          NEKO_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NEKO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          NEKO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEKO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in 'NEKO_ANDROID_KEYSTORE_BASE64', 'NEKO_ANDROID_STORE_PASSWORD', 'NEKO_ANDROID_KEY_ALIAS', 'NEKO_ANDROID_KEY_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing Android release signing secret: $($name.Substring(5))."
            }
          }

          $env:NEKO_ANDROID_KEYSTORE = Join-Path $env:RUNNER_TEMP 'nekoproxy-release.jks'
          $cert = Join-Path $env:RUNNER_TEMP 'nekoproxy-release.der'
          try {
            [IO.File]::WriteAllBytes($env:NEKO_ANDROID_KEYSTORE, [Convert]::FromBase64String($env:NEKO_ANDROID_KEYSTORE_BASE64))
            Remove-Item Env:NEKO_ANDROID_KEYSTORE_BASE64
            ./scripts/package-android.ps1

            $apks = @(Get-ChildItem -Path 'dist/*-android-arm64.apk' -File)
            if ($apks.Count -ne 1) { throw 'Expected exactly one Android APK.' }
            $keytool = Join-Path $env:JAVA_HOME 'bin/keytool.exe'
            & $keytool -exportcert -keystore $env:NEKO_ANDROID_KEYSTORE -alias $env:NEKO_ANDROID_KEY_ALIAS -storepass:env NEKO_ANDROID_STORE_PASSWORD -file $cert
            if ($LASTEXITCODE -ne 0) { throw 'Could not export the release certificate.' }
            $apksigner = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat'
            $verification = & $apksigner verify --print-certs $apks[0].FullName
            if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed.' }
            $signers = @($verification | Select-String '^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-f]{64})$')
            if ($signers.Count -ne 1 -or $signers[0].Matches[0].Groups[1].Value -ne (Get-FileHash -LiteralPath $cert -Algorithm SHA256).Hash) {
              throw 'APK is not signed with the configured release certificate.'
            }
          } finally {
            foreach ($path in $env:NEKO_ANDROID_KEYSTORE, $cert) {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
            }
          }

      - name: Test the pinned development runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          git submodule update --init --depth 1 third_party/sing-box
          cd runtime
          go test -mod=readonly -tags with_gvisor,with_quic,with_wireguard,with_utls ./...

      - name: Set up Flutter and Linux build tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev
          git clone --quiet --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Package Linux x64
        if: matrix.platform == 'linux'
        shell: pwsh
        env: *rule-metadata-env
        run: ./scripts/package-linux.ps1

      - name: Verify Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          artifact=(dist/NekoProxy-*-linux-x64.deb)
          test "$(dpkg-deb --field "${artifact[0]}" Architecture)" = amd64
          package_dir=$(mktemp -d)
          dpkg-deb --extract "${artifact[0]}" "$package_dir"
          ldd "$package_dir/usr/lib/nekoproxy/nekoproxy" > "$RUNNER_TEMP/nekoproxy-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/nekoproxy-ldd.txt"; then
            cat "$RUNNER_TEMP/nekoproxy-ldd.txt"
            exit 1
          fi
          test -x "$package_dir/usr/lib/nekoproxy/nekoproxy-worker"
          test -x "$package_dir/usr/lib/nekoproxy/nekoproxy-tun-worker"
          sudo dpkg -i "${artifact[0]}"
          if [[ ! -c /dev/net/tun ]]; then sudo modprobe tun; fi
          sudo bash scripts/linux/test-runtime.sh
          dart format --output=none --set-exit-if-changed lib/services/linux_system_proxy.dart test/linux_system_proxy_test.dart
          flutter test --no-pub test/linux_system_proxy_test.dart test/config_compiler_test.dart

      - name: Record bundled upstream versions
        if: github.ref_type == 'tag' && matrix.platform != 'linux'
        shell: pwsh
        run: Copy-Item -LiteralPath assets/rules/manifest.json -Destination dist/rules-manifest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/NekoProxy-*.apk
            dist/NekoProxy-*.zip
            dist/NekoProxy-*-setup.exe
            dist/NekoProxy-*-linux-x64.deb
            dist/NekoProxy-*.sha256
            dist/rules-manifest.json
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nekoproxy-release-publish
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Use the job token for lease-protected deletion of old remote refs.
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT_SHA: ${{ github.event.after }}
        run: |
          shopt -s nullglob
          apk=(release/android/NekoProxy-*-android-arm64.apk)
          zip=(release/windows/NekoProxy-*-windows-x64.zip)
          setup=(release/windows/NekoProxy-*-windows-x64-setup.exe)
          deb=(release/linux/NekoProxy-*-linux-x64.deb)
          if (( ${#apk[@]} != 1 || ${#zip[@]} != 1 || ${#setup[@]} != 1 || ${#deb[@]} != 1 )); then
            echo 'Expected one APK, one Windows ZIP, one Windows installer and one Linux package.' >&2
            exit 1
          fi

          assets=()
          for file in "${apk[0]}" "${zip[0]}" "${setup[0]}" "${deb[0]}"; do
            (cd "$(dirname "$file")" && sha256sum --check "$(basename "$file").sha256")
            assets+=("$file" "$file.sha256")
          done

          {
            printf '## 上游版本\n\n'
            for platform in windows android linux; do
              manifest="release/$platform/rules-manifest.json"
              sing_box=$(jq -er '.singBox | select(type == "string" and length > 0)' "$manifest")
              geosite=$(jq -er '.releases.geosite.tag | select(type == "string" and length > 0)' "$manifest")
              geoip=$(jq -er '.releases.geoip.tag | select(type == "string" and length > 0)' "$manifest")
              printf -- '- %s: sing-box `%s`, GeoSite `%s`, GeoIP `%s`\n' "$platform" "$sing_box" "$geosite" "$geoip"
            done
          } > release-notes.md

          python3 scripts/publish-release.py release-notes.md "${assets[@]}"
